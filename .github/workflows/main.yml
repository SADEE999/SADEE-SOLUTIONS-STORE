name: SADEE SOLUTIONS STORE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    name: Check Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          set -e

          echo "=============================="
          echo "SADEE SOLUTIONS STORE"
          echo "=============================="

          test -f index.html
          echo "✅ index.html"

          test -f config.js
          echo "✅ config.js"

          test -f app.js
          echo "✅ app.js"

          test -d admin
          echo "✅ admin/"

          test -d assets
          echo "✅ assets/"

          echo ""
          echo "=============================="
          echo "✅ WEBSITE FILES READY"
          echo "=============================="
